openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /weekly-parsha:
    get:
      operationId: getWeeklyParsha
      summary: Weekly Torah portion from Sefaria's Israel calendar
      responses:
        "200":
          description: Current weekly portion
          content:
            application/json:
              schema:
                type: object
                required: [titleEn, titleHe, ref, heRef, href]
                properties:
                  titleEn: { type: string }
                  titleHe: { type: string }
                  ref: { type: string }
                  heRef: { type: string }
                  href: { type: string }
        "502":
          description: Calendar unavailable or invalid
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

